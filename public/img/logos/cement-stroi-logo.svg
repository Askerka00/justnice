<svg viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
  <!-- Белая подложка круга -->
  <circle cx="150" cy="150" r="140" fill="#ffffff" />
  
  <!-- Домик -->
  <path d="M150 50 L60 120 L75 120 L75 200 L225 200 L225 120 L240 120 Z" fill="#0F766E"/>
  <!-- Труба -->
  <rect x="85" y="65" width="15" height="35" fill="#0F766E" />
  
  <!-- Молоток 1 (наклонен влево) -->
  <g transform="translate(110, 140) rotate(-45)">
    <!-- Ручка -->
    <rect x="-4" y="-25" width="8" height="50" rx="2" fill="#ffffff"/>
    <!-- Головка молотка -->
    <path d="M-12 -30 L12 -30 L12 -20 L-12 -20 Z" fill="#ffffff"/>
    <path d="M-12 -30 L-18 -25 L-12 -20 Z" fill="#ffffff"/>
  </g>
  
  <!-- Молоток 2 (наклонен вправо) -->
  <g transform="translate(190, 140) rotate(45)">
    <!-- Ручка -->
    <rect x="-4" y="-25" width="8" height="50" rx="2" fill="#ffffff"/>
    <!-- Головка молотка -->
    <path d="M-12 -30 L12 -30 L12 -20 L-12 -20 Z" fill="#ffffff"/>
    <path d="M12 -30 L18 -25 L12 -20 Z" fill="#ffffff"/>
  </g>
  
  <!-- Окошко -->
  <rect x="140" y="145" width="20" height="20" rx="2" fill="#ffffff"/>
  
  <!-- Текст -->
  <text x="150" y="240" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="900" fill="#0F766E" text-anchor="middle" letter-spacing="1">ЦЕМЕНТ</text>
  <text x="150" y="270" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="18" font-weight="700" fill="#52525b" text-anchor="middle" letter-spacing="3">СТРОЙ</text>
</svg>
