<svg viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
  <!-- Черный круг с красной рамкой -->
  <circle cx="150" cy="150" r="140" fill="#141416" stroke="#dc2626" stroke-width="8" />
  
  <!-- Задний план: Тонкие круговые линии энергии -->
  <circle cx="150" cy="150" r="120" fill="none" stroke="#27272a" stroke-width="2" />
  <circle cx="150" cy="150" r="100" fill="none" stroke="#27272a" stroke-width="1" stroke-dasharray="5 5" />

  <!-- Иконка Аккумулятора (в центре) -->
  <g transform="translate(150, 125)">
    <!-- Клеммы сверху -->
    <rect x="-45" y="-52" width="18" height="12" fill="#ef4444" rx="2" />
    <rect x="27" y="-52" width="18" height="12" fill="#3b82f6" rx="2" />
    
    <!-- Основной корпус аккумулятора -->
    <rect x="-60" y="-40" width="120" height="75" fill="#dc2626" rx="6" />
    <rect x="-52" y="-32" width="104" height="59" fill="#1e1e20" rx="4" />
    
    <!-- Обозначения клемм: плюс и минус -->
    <!-- Минус (-) на синей клемме справа -->
    <line x1="36" y1="-20" x2="48" y2="-20" stroke="#3b82f6" stroke-width="4" stroke-linecap="round" />
    <!-- Плюс (+) на красной клемме слева -->
    <line x1="-42" y1="-20" x2="-30" y2="-20" stroke="#ef4444" stroke-width="4" stroke-linecap="round" />
    <line x1="-36" y1="-26" x2="-36" y2="-14" stroke="#ef4444" stroke-width="4" stroke-linecap="round" />

    <!-- Знак молнии по центру -->
    <polygon points="-5 -22, 12 -22, 0 -3, 10 -3, -8 24, -2 3, -10 3" fill="#fbbf24" />
  </g>

  <!-- Текст AKB-SHOP.KZ -->
  <g transform="translate(150, 240)">
    <text font-family="'Outfit', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif" 
          font-size="24" 
          font-weight="900" 
          text-anchor="middle" 
          letter-spacing="2">
      <tspan fill="#ffffff">AKB-</tspan>
      <tspan fill="#dc2626">SHOP.KZ</tspan>
    </text>
    <text font-family="'Outfit', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif" 
          font-size="11" 
          font-weight="700" 
          fill="#9ca3af" 
          text-anchor="middle" 
          letter-spacing="4" 
          y="22">
      АККУМУЛЯТОРЫ В АЛМАТЫ
    </text>
  </g>
</svg>
