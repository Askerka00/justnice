<svg viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
  <!-- Синий фон круга с белой рамкой -->
  <circle cx="150" cy="150" r="140" fill="#6366f1" stroke="#ffffff" stroke-width="8" />
  
  <!-- Декоративные линии скорости (эффект движения) -->
  <path d="M 40 120 L 80 120 M 30 140 L 70 140 M 45 160 L 75 160" stroke="#ffffff" stroke-width="6" stroke-linecap="round" opacity="0.8" />

  <!-- Стилизованный грузовой фургон Газель (в центре) -->
  <g transform="translate(70, 95)" fill="#ffffff">
    <!-- Кузов фургона -->
    <rect x="30" y="5" width="95" height="65" rx="5" />
    
    <!-- Кабина водителя -->
    <path d="M 125 25 L 145 25 C 152 25, 160 33, 160 42 L 160 70 L 125 70 Z" />
    <!-- Окно кабины -->
    <path d="M 128 30 L 143 30 C 147 30, 152 35, 152 40 L 152 50 L 128 50 Z" fill="#6366f1" />
    
    <!-- Бампер и крыло -->
    <rect x="150" y="65" width="15" height="7" rx="2" fill="#e2e8f0" />
    <circle cx="145" cy="73" r="15" fill="#6366f1" />
    <circle cx="55" cy="73" r="15" fill="#6366f1" />
    
    <!-- Колеса -->
    <circle cx="55" cy="73" r="10" fill="#ffffff" />
    <circle cx="55" cy="73" r="4" fill="#6366f1" />
    <circle cx="145" cy="73" r="10" fill="#ffffff" />
    <circle cx="145" cy="73" r="4" fill="#6366f1" />
  </g>

  <!-- Текст GRUZOPEREVOZ.KZ -->
  <g transform="translate(150, 240)">
    <text font-family="'Outfit', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif" 
          font-size="24" 
          font-weight="900" 
          text-anchor="middle" 
          fill="#ffffff" 
          letter-spacing="2">
      GRUZOPEREVOZ
    </text>
    <text font-family="'Outfit', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif" 
          font-size="14" 
          font-weight="700" 
          fill="#cbd5e1" 
          text-anchor="middle" 
          letter-spacing="4" 
          y="22">
      БЫСТРО • НАДЕЖНО • 24/7
    </text>
  </g>
</svg>
