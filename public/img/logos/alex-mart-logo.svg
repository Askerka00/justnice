<svg viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
  <!-- Белая подложка круга -->
  <circle cx="150" cy="150" r="140" fill="#ffffff" />
  
  <!-- Двойная крыша (коричневая #4E3629) -->
  <!-- Левая крыша -->
  <path d="M75 140 L125 90 L175 140" stroke="#4E3629" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- Правая крыша -->
  <path d="M125 140 L175 90 L225 140" stroke="#4E3629" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  
  <!-- Окна под крышами -->
  <!-- Левое окошко (4 маленьких квадрата) -->
  <g transform="translate(115, 115)" fill="#4E3629">
    <rect x="0" y="0" width="8" height="8" rx="1"/>
    <rect x="11" y="0" width="8" height="8" rx="1"/>
    <rect x="0" y="11" width="8" height="8" rx="1"/>
    <rect x="11" y="11" width="8" height="8" rx="1"/>
  </g>
  <!-- Правое окошко (4 маленьких квадрата) -->
  <g transform="translate(165, 115)" fill="#4E3629">
    <rect x="0" y="0" width="8" height="8" rx="1"/>
    <rect x="11" y="0" width="8" height="8" rx="1"/>
    <rect x="0" y="11" width="8" height="8" rx="1"/>
    <rect x="11" y="11" width="8" height="8" rx="1"/>
  </g>
  
  <!-- Текст AlexMart -->
  <g transform="translate(150, 210)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="40" font-weight="900" text-anchor="middle" letter-spacing="-1">
      <tspan fill="#76BA1B">Alex</tspan><tspan fill="#0F5132">Mart</tspan>
    </text>
  </g>
</svg>
