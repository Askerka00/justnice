<svg viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
  <!-- Темный фон круга с золотистой рамкой -->
  <circle cx="150" cy="150" r="140" fill="#1e1b4b" stroke="#f59e0b" stroke-width="8" />
  
  <!-- Задний план: Шестеренка/Гайка (символ механики и спецтехники) -->
  <path d="M 150 35 L 180 35 L 195 55 L 225 45 L 230 75 L 255 85 L 245 115 L 265 135 L 245 165 L 255 195 L 230 205 L 225 235 L 195 225 L 180 245 L 150 245 L 120 245 L 105 225 L 75 235 L 70 205 L 45 195 L 55 165 L 35 135 L 55 105 L 45 75 L 70 65 L 75 35 L 105 45 L 120 35 Z" 
        fill="none" 
        stroke="#f59e0b" 
        stroke-width="3" 
        stroke-dasharray="10 5" 
        opacity="0.3" />

  <!-- Ковш экскаватора (стилизованный в центре) -->
  <g transform="translate(150, 130)" fill="#f59e0b">
    <!-- Стрела/рукоять экскаватора -->
    <path d="M -70 -30 L -45 -45 L -20 -10 L -45 5 Z" fill="#d97706" />
    <path d="M -22 -12 L 15 -35 L 25 -20 L -12 2 Z" fill="#f59e0b" />
    
    <!-- Сам ковш -->
    <path d="M 15 -30 C 35 -40, 65 -30, 65 -5 C 65 20, 35 30, 10 20 C 5 18, 12 5, 20 8 C 35 12, 50 8, 50 -5 C 50 -18, 32 -22, 18 -15 Z" />
    
    <!-- Зубья ковша -->
    <polygon points="5 21, -5 23, 2 15" />
    <polygon points="12 20, 6 24, 11 14" />
    <polygon points="18 18, 14 23, 17 12" />
  </g>

  <!-- Декоративные полосы (желтая и оранжевая) как на строительной технике -->
  <path d="M 80 190 L 220 190" stroke="#f59e0b" stroke-width="4" />
  <path d="M 100 198 L 200 198" stroke="#d97706" stroke-width="2" />

  <!-- Текст ТОО СПЕЦАВТОКОВШ -->
  <g transform="translate(150, 240)">
    <text font-family="'Outfit', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif" 
          font-size="20" 
          font-weight="900" 
          text-anchor="middle" 
          letter-spacing="2">
      <tspan fill="#ffffff">ТОО </tspan>
      <tspan fill="#f59e0b">СПЕЦАВТОКОВШ</tspan>
    </text>
    <text font-family="'Outfit', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif" 
          font-size="12" 
          font-weight="700" 
          fill="#9ca3af" 
          text-anchor="middle" 
          letter-spacing="4" 
          y="20">
      АРЕНДА СПЕЦТЕХНИКИ
    </text>
  </g>
</svg>
