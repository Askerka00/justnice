<svg viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg" width="100%" height="100%">
  <!-- Темный фон круга -->
  <circle cx="150" cy="150" r="140" fill="#141416" stroke="#ff791a" stroke-width="8" />
  
  <!-- Декоративная фоновая сетка (имитация карты) -->
  <path d="M 40 120 L 260 200" stroke="#27272a" stroke-width="2" opacity="0.4" />
  <path d="M 60 240 L 240 60" stroke="#27272a" stroke-width="2" opacity="0.4" />
  <path d="M 110 260 L 280 90" stroke="#27272a" stroke-width="2" opacity="0.4" />
  <path d="M 30 180 L 180 30" stroke="#27272a" stroke-width="2" opacity="0.4" />
  <path d="M 150 20 L 150 280" stroke="#27272a" stroke-width="2" opacity="0.2" />
  <path d="M 20 150 L 280 150" stroke="#27272a" stroke-width="2" opacity="0.2" />

  <!-- Буква L (Белая, внешняя петля) -->
  <path d="M 90 75 L 90 185 L 190 185 L 190 148 L 138 148" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="16" 
        stroke-linejoin="miter" 
        stroke-linecap="square" />

  <!-- Буква B (Оранжевая) -->
  <!-- Вертикальная стойка -->
  <line x1="126" y1="75" x2="126" y2="177" stroke="#ff791a" stroke-width="16" stroke-linecap="square" />
  <!-- Upper loop of B -->
  <path d="M 126 83 C 172 83, 172 131, 126 131" 
        stroke="#ff791a" 
        stroke-width="16" 
        fill="none" 
        stroke-linejoin="miter" 
        stroke-linecap="square" />
  <!-- Lower loop of B (nested inside L's white loop) -->
  <path d="M 126 131 C 176 131, 176 177, 126 177" 
        stroke="#ff791a" 
        stroke-width="16" 
        fill="none" 
        stroke-linejoin="miter" 
        stroke-linecap="square" />

  <!-- Текст LOCK BUSTERS -->
  <g transform="translate(150, 245)">
    <text font-family="'Outfit', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif" 
          font-size="22" 
          font-weight="900" 
          text-anchor="middle" 
          letter-spacing="3">
      <tspan fill="#ffffff">LOCK</tspan>
      <tspan fill="#ff791a"> BUSTERS</tspan>
    </text>
  </g>
</svg>
